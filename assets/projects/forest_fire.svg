<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="fireBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14" />
      <stop offset="40%" stop-color="#140f1a" />
      <stop offset="80%" stop-color="#1f0d0e" />
      <stop offset="100%" stop-color="#0d080c" />
    </linearGradient>

    <linearGradient id="heatFlame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.95" />
    </linearGradient>

    <radialGradient id="thermalHotspot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.75" />
      <stop offset="40%" stop-color="#f97316" stop-opacity="0.45" />
      <stop offset="75%" stop-color="#eab308" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="thermalMedium" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181829" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f0e1c" stop-opacity="0.95" />
    </linearGradient>

    <filter id="fireGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softFireGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="geoGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#33243a" stroke-width="0.8" stroke-opacity="0.35" />
      <circle cx="40" cy="40" r="1.5" fill="#f97316" opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="600" fill="url(#fireBgGrad)" />
  <rect width="900" height="600" fill="url(#geoGrid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="280" cy="260" r="200" fill="url(#thermalHotspot)" filter="url(#fireGlow)" />
  <circle cx="160" cy="380" r="140" fill="url(#thermalMedium)" filter="url(#fireGlow)" />
  <circle cx="750" cy="180" r="160" fill="#3b82f6" opacity="0.08" filter="url(#fireGlow)" />

  <!-- Outer HUD Frame -->
  <rect x="25" y="25" width="850" height="550" rx="16" fill="none" stroke="#2e1d38" stroke-width="1.5" stroke-opacity="0.8" />
  <path d="M 25 55 L 55 25 M 875 55 L 845 25 M 25 545 L 55 575 M 875 545 L 845 575" stroke="#f97316" stroke-width="2" stroke-opacity="0.7" fill="none" />

  <!-- Top Header HUD -->
  <g transform="translate(45, 50)">
    <rect x="0" y="0" width="8" height="24" rx="2" fill="#f97316" filter="url(#softFireGlow)" />
    <text x="18" y="17" fill="#f8fafc" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">GEOSPATIAL AI RISK MONITOR</text>
    <rect x="670" y="0" width="140" height="26" rx="13" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1" />
    <circle cx="685" cy="13" r="4" fill="#ef4444" filter="url(#softFireGlow)" />
    <text x="696" y="18" fill="#fca5a5" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11" font-weight="600">HIGH HAZARD ALERT</text>
  </g>

  <!-- Left Map & Heatmap Visualizer Viewport -->
  <g transform="translate(45, 95)">
    <!-- Map Container Frame -->
    <rect x="0" y="0" width="460" height="390" rx="14" fill="#0c0d1c" stroke="#373052" stroke-width="1.5" />

    <!-- Topographic Contour Lines -->
    <g fill="none" stroke="#473b64" stroke-width="1.2" stroke-dasharray="3 3">
      <path d="M 20 200 Q 120 120 240 180 T 440 140" />
      <path d="M 20 260 Q 140 180 260 240 T 440 210" />
      <path d="M 20 320 Q 160 250 280 300 T 440 280" />
      <path d="M 60 80 Q 200 40 320 100 T 440 70" />
    </g>

    <!-- Glowing Thermal Heatmap Polygons -->
    <!-- Low Risk Zone (Green/Cyan) -->
    <path d="M 80 340 Q 180 310 220 360 T 360 340 Q 300 400 180 380 Z" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-width="1" />
    
    <!-- Medium Risk Zone (Yellow/Orange) -->
    <path d="M 140 240 Q 260 190 320 270 T 260 340 Q 180 320 140 240 Z" fill="#f59e0b" fill-opacity="0.35" stroke="#f59e0b" stroke-width="1.2" />

    <!-- Critical Hotspot Zone (Red/Flame) -->
    <path d="M 210 210 Q 280 180 310 230 T 260 280 Q 200 270 210 210 Z" fill="url(#heatFlame)" fill-opacity="0.65" stroke="#ef4444" stroke-width="2" filter="url(#softFireGlow)" />

    <!-- Target Radar & Crosshair at Fire Outbreak Epicenter -->
    <g transform="translate(260, 235)">
      <circle cx="0" cy="0" r="45" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="4 4" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#f97316" stroke-width="1.5" />
      <circle cx="0" cy="0" r="6" fill="#ef4444" filter="url(#softFireGlow)" />
      <!-- Crosshairs -->
      <line x1="-55" y1="0" x2="-10" y2="0" stroke="#ef4444" stroke-width="1.5" />
      <line x1="10" y1="0" x2="55" y2="0" stroke="#ef4444" stroke-width="1.5" />
      <line x1="0" y1="-55" x2="0" y2="-10" stroke="#ef4444" stroke-width="1.5" />
      <line x1="0" y1="10" x2="0" y2="55" stroke="#ef4444" stroke-width="1.5" />
      <!-- Pulse Wave -->
      <circle cx="0" cy="0" r="60" fill="none" stroke="#ef4444" stroke-width="1" opacity="0.4" />
    </g>

    <!-- Outbreak HUD Label -->
    <g transform="translate(260, 160)">
      <rect x="25" y="-12" width="150" height="24" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="1" />
      <text x="33" y="4" fill="#fecaca" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">SECTOR-4 OUTBREAK</text>
      <line x1="0" y1="20" x2="25" y2="0" stroke="#ef4444" stroke-width="1.2" />
    </g>

    <!-- Map Info Overlay (Bottom) -->
    <g transform="translate(20, 345)">
      <rect x="0" y="0" width="420" height="32" rx="6" fill="#080814" fill-opacity="0.85" stroke="#25243b" stroke-width="1" />
      <text x="12" y="20" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">GPS: <tspan fill="#f8fafc" font-weight="600">11.0168° N, 76.9558° E</tspan> | ELEV: <tspan fill="#f8fafc" font-weight="600">412m</tspan> | SAT: <tspan fill="#10b981">LOCK</tspan></text>
    </g>
  </g>

  <!-- Right Analytics & Telemetry Dashboard Cards -->
  <g transform="translate(525, 95)">
    <!-- Main AI Prediction Card -->
    <rect x="0" y="0" width="330" height="185" rx="12" fill="url(#cardBg)" stroke="#3b2b48" stroke-width="1.5" />
    
    <!-- Card Header -->
    <text x="20" y="28" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="700">AI PREDICTION INFERENCE</text>
    <rect x="235" y="14" width="75" height="20" rx="10" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1" />
    <text x="272" y="28" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">CRITICAL</text>
    
    <!-- Risk Meter Arc / Progress Bar -->
    <text x="20" y="65" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Wildfire Risk Probability</text>
    <text x="260" y="65" fill="#f97316" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="800" filter="url(#softFireGlow)">87.4%</text>

    <rect x="20" y="78" width="290" height="10" rx="5" fill="#231d2e" />
    <rect x="20" y="78" width="253" height="10" rx="5" fill="url(#heatFlame)" />

    <line x1="20" y1="102" x2="310" y2="102" stroke="#2d223a" stroke-width="1" />

    <!-- AI Model Metadata -->
    <g transform="translate(20, 122)" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">
      <text x="0" y="0">MODEL: <tspan fill="#f8fafc" font-weight="600">XGBoost &bull; Random Forest</tspan></text>
      <text x="0" y="20">DATASET: <tspan fill="#f8fafc" font-weight="600">Meteorological &amp; Satellite</tspan></text>
      <text x="0" y="40">ACCURACY: <tspan fill="#34d399" font-weight="700">96.8% (F1: 0.94)</tspan></text>
    </g>

    <!-- Real-Time Telemetry Sensors Card (Bottom Right) -->
    <g transform="translate(0, 205)">
      <rect x="0" y="0" width="330" height="185" rx="12" fill="url(#cardBg)" stroke="#3b2b48" stroke-width="1.5" />
      <text x="20" y="28" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="700">TELEMETRY &amp; ALERT DISPATCH</text>

      <!-- Sensor Grid 2x2 -->
      <g transform="translate(20, 45)">
        <!-- Temp -->
        <rect x="0" y="0" width="138" height="50" rx="6" fill="#1e1828" stroke="#3b2f4a" stroke-width="1" />
        <text x="12" y="18" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Ambient Temp</text>
        <text x="12" y="38" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700">41.8 °C</text>

        <!-- Humidity -->
        <rect x="152" y="0" width="138" height="50" rx="6" fill="#1e1828" stroke="#3b2f4a" stroke-width="1" />
        <text x="12" y="18" transform="translate(152, 0)" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Relative Humidity</text>
        <text x="12" y="38" transform="translate(152, 0)" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700">14.2 %</text>

        <!-- Wind Speed -->
        <rect x="0" y="60" width="138" height="50" rx="6" fill="#1e1828" stroke="#3b2f4a" stroke-width="1" />
        <text x="12" y="78" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Wind Velocity</text>
        <text x="12" y="98" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700">28.4 km/h</text>

        <!-- Alert Gateway -->
        <rect x="152" y="60" width="138" height="50" rx="6" fill="#1e1828" stroke="#3b2f4a" stroke-width="1" />
        <text x="12" y="78" transform="translate(152, 0)" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Dispatch API</text>
        <text x="12" y="98" transform="translate(152, 0)" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">WHATSAPP: OK</text>
      </g>
    </g>
  </g>

  <!-- Bottom Details Banner -->
  <g transform="translate(45, 510)">
    <text x="0" y="18" fill="#f8fafc" font-family="'Inter', -apple-system, sans-serif" font-size="20" font-weight="700">Forest Fire Prediction System</text>
    <text x="0" y="40" fill="#94a3b8" font-family="'Inter', -apple-system, sans-serif" font-size="13">React &bull; Node.js &bull; Python &bull; REST APIs &bull; Google Maps &bull; AI Risk Modeling &bull; WhatsApp Alert Integration</text>
    
    <!-- Feature Pill Badges -->
    <g transform="translate(560, 0)">
      <rect x="0" y="0" width="110" height="28" rx="14" fill="#f97316" fill-opacity="0.12" stroke="#f97316" stroke-width="1" />
      <text x="55" y="18" fill="#fb923c" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">AI APPLICATION</text>
      
      <rect x="120" y="0" width="120" height="28" rx="14" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-width="1" />
      <text x="180" y="18" fill="#f87171" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">EARLY WARNING</text>
    </g>
  </g>
</svg>
