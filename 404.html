<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting — Kabilan M Portfolio</title>
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(16, 185, 129, 0.2);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 500;
    }
  </style>
  <script>
    // Firebase Hosting Route Resolver
    (function() {
      var pathname = window.location.pathname || '/';
      var search = window.location.search || '';
      var hash = window.location.hash || '';

      var segments = pathname.split('/').filter(Boolean);
      var lastSegment = segments.length > 0 ? segments[segments.length - 1].toLowerCase() : '';

      // Route admin requests
      if (lastSegment === 'admin' || lastSegment === 'admin.html') {
        window.location.replace('/admin.html' + search + hash);
        return;
      }

      // Route known sections
      var sectionMap = {
        'about': 'about',
        'projects': 'projects',
        'skills': 'skills',
        'education': 'education',
        'achievements': 'achievements',
        'contact': 'contact',
        'terminal': 'terminal'
      };

      if (sectionMap[lastSegment]) {
        window.location.replace('/index.html#' + sectionMap[lastSegment] + search + hash);
        return;
      }

      // Subpage routes under pages/
      if (pathname.includes('/pages/')) {
        var page = segments[segments.length - 1];
        if (page && (page === 'about' || page === 'projects' || page === 'contact')) {
          window.location.replace('/pages/' + page + '.html' + search + hash);
          return;
        }
      }

      // Default fallback: root index
      window.location.replace('/index.html' + search + hash);
    })();
  </script>
</head>
<body>
  <div class="spinner"></div>
  <p>Connecting to Firebase Portfolio...</p>
  <p style="font-size: 0.85rem; color: #94a3b8; margin-top: 8px;">If you are not redirected automatically, <a href="/index.html">click here to return home</a>.</p>
</body>
</html>
