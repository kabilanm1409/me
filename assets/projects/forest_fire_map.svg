<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <defs>
    <linearGradient id="mapBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121e" />
      <stop offset="60%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#050d18" />
    </linearGradient>
    <radialGradient id="hotspot1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="hotspot2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <filter id="mapGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="900" height="600" fill="url(#mapBgGrad)" />

  <!-- Grid lines -->
  <g stroke="#00f0ff" stroke-width="0.5" opacity="0.15">
    <line x1="0" y1="100" x2="900" y2="100" />
    <line x1="0" y1="200" x2="900" y2="200" />
    <line x1="0" y1="300" x2="900" y2="300" />
    <line x1="0" y1="400" x2="900" y2="400" />
    <line x1="0" y1="500" x2="900" y2="500" />
    <line x1="150" y1="0" x2="150" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="450" y1="0" x2="450" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
    <line x1="750" y1="0" x2="750" y2="600" />
  </g>

  <!-- Top Title HUD -->
  <rect x="30" y="30" width="840" height="60" rx="6" fill="#081426" stroke="#00f0ff" stroke-width="1.5" opacity="0.9" />
  <text x="50" y="68" fill="#00f0ff" font-family="'Fira Code', monospace" font-size="20" font-weight="700">FOREST FIRE RISK TELEMETRY &amp; PREDICTION MAP</text>
  <text x="730" y="68" fill="#00ff9d" font-family="'Fira Code', monospace" font-size="14">AI INFERENCE: ACTIVE</text>

  <!-- Thermal Hotspots on Map -->
  <circle cx="340" cy="280" r="120" fill="url(#hotspot1)" />
  <circle cx="560" cy="340" r="90" fill="url(#hotspot2)" />
  <circle cx="480" cy="220" r="70" fill="url(#hotspot1)" />

  <!-- Node Markers -->
  <circle cx="340" cy="280" r="6" fill="#ffffff" filter="url(#mapGlow)" />
  <circle cx="340" cy="280" r="18" fill="none" stroke="#ef4444" stroke-width="2" />
  <text x="355" y="275" fill="#ef4444" font-family="'Inter', sans-serif" font-size="13" font-weight="700">ZONE-A: RISK 88% (CRITICAL)</text>

  <circle cx="560" cy="340" r="5" fill="#ffffff" filter="url(#mapGlow)" />
  <circle cx="560" cy="340" r="14" fill="none" stroke="#f59e0b" stroke-width="2" />
  <text x="575" y="335" fill="#f59e0b" font-family="'Inter', sans-serif" font-size="13" font-weight="700">ZONE-B: RISK 52% (ELEVATED)</text>

  <!-- Telemetry HUD Bottom Box -->
  <rect x="30" y="470" width="840" height="95" rx="6" fill="#081426" stroke="#38bdf8" stroke-width="1" opacity="0.95" />
  <text x="50" y="505" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="14" font-weight="700">METEOROLOGICAL SENSORS &amp; THERMAL ANOMALIES</text>
  <text x="50" y="535" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="12">Temp: 41.8°C  •  Humidity: 18%  •  Wind Velocity: 24 km/h  •  Algorithm: Random Forest + XGBoost  •  Latency: 42ms</text>
</svg>
